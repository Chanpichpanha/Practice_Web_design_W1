            height: auto;

        p {
            font-size: 15px;
            line-height: 1.6;
            color: #475569;
            text-align: left;
            margin: 15px 0;
        }
        ul {
            text-align: left;
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 15px 20px 15px 35px;
            margin: 15px 0 5px 0;
        }
        li {
            font-size: 14px;
            color: #334155;
            margin-bottom: 8px;
            line-height: 1.5;
        }
        li:last-child {
            margin-bottom: 0;
        }
        li a {
